          function isIndiaUser() {
            try {
              var tz = (Intl && Intl.DateTimeFormat) ? Intl.DateTimeFormat().resolvedOptions().timeZone : "";
              if (tz === "Asia/Kolkata" || tz === "Asia/Calcutta" || tz.indexOf("Kolkata") !== -1 || tz.indexOf("Calcutta") !== -1) {
                return true;
              }
            } catch (e) {}
            var lang = (navigator.language || "").toLowerCase();
            return lang === "hi" || lang.indexOf("hi-") === 0 || lang.indexOf("-in") !== -1;
          }

          function extractAsin(url) {
            if (!url) return null;
            var dpMatch = url.match(/(?:\/dp\/|\/gp\/product\/|\/d\/|\/product\/)([A-Z0-9]{10})(?:[/?&#]|$)/i);
            if (dpMatch && dpMatch[1]) return dpMatch[1].toUpperCase();
            var queryMatch = url.match(/[?&]asin=([A-Z0-9]{10})(?:[&]|$)/i);
            if (queryMatch && queryMatch[1]) return queryMatch[1].toUpperCase();
            return null;
          }

          function rewriteAllAmazonLinks() {
            var isIndia = isIndiaUser();
            var targetDomain = isIndia ? "www.amazon.in" : "www.amazon.com";
            var targetTag = isIndia ? "jaiguruji00-21" : "jaiguruji00-20";

            var anchors = document.querySelectorAll("a[href*='amazon.']");
            anchors.forEach(function(a) {
              var href = a.getAttribute("href") || "";
              if (!href) return;
              var asin = extractAsin(href);
              if (asin) {
                a.href = "https://" + targetDomain + "/dp/" + asin + "?tag=" + targetTag;
              } else if (href.indexOf("/s?") !== -1 || href.indexOf("/s/") !== -1) {
                try {
                  var urlObj = new URL(href, window.location.origin);
                  urlObj.hostname = targetDomain;
                  urlObj.searchParams.set("tag", targetTag);
                  a.href = urlObj.toString();
                } catch(err) {}
              }
              a.setAttribute("target", "_blank");
              if (!a.getAttribute("rel") || a.getAttribute("rel").indexOf("noopener") === -1) {
                a.setAttribute("rel", "noopener noreferrer");
              }
            });
          }

          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", rewriteAllAmazonLinks);
          } else {
            rewriteAllAmazonLinks();
          }

        } catch(e) {}
