        function getCategoryFromQuery(str) {
          if (!str) return 'general';
          var s = str.toLowerCase();
          if (s.includes('phone') || s.includes('mobile') || s.includes('iphone') || s.includes('samsung') || s.includes('oneplus') || s.includes('redmi') || s.includes('pixel') || s.includes('5g') || s.includes('nord')) return 'phone';
          if (s.includes('laptop') || s.includes('macbook') || s.includes('dell') || s.includes('asus') || s.includes('hp') || s.includes('lenovo') || s.includes('computer') || s.includes('notebook')) return 'laptop';
          if (s.includes('tv') || s.includes('television') || s.includes('oled') || s.includes('qled') || s.includes('bravia') || s.includes('4k')) return 'tv';
          if (s.includes('ac') || s.includes('conditioner') || s.includes('cooler') || s.includes('split ac') || s.includes('daikin') || s.includes('appliance')) return 'ac';
          if (s.includes('audio') || s.includes('earbud') || s.includes('headphone') || s.includes('tws') || s.includes('earphone') || s.includes('sony wh') || s.includes('bose') || s.includes('anc')) return 'audio';
          return 'general';
        }

        function extractQuery() {
          try {
            var url = new URL(window.location.href);
            var q = url.searchParams.get('q') || url.searchParams.get('query');
            if (q) return q.trim();

            var path = url.pathname;
            if (path.indexOf('/review/') === 0) {
              return decodeURIComponent(path.substring(8).replace(/[-_]/g, ' ')).trim();
            }
            if (path.indexOf('/compare/') === 0) {
              return decodeURIComponent(path.substring(9).replace(/[-_]/g, ' ')).trim();
            }

            if (url.hash) {
              var hash = url.hash.replace(/^#\/?/, '');
              var hQuery = (hash.indexOf('?') >= 0) ? hash.split('?')[1] : hash;
              var hp = new URLSearchParams(hQuery);
              var hq = hp.get('q') || hp.get('query');
              if (hq) return hq.trim();
            }
          } catch (e) {}
          return '';
        }

        function injectFaqSchema() {
          var query = extractQuery();
          var category = getCategoryFromQuery(query);
          var faqs = FAQ_DATABASE[category] || FAQ_DATABASE.general;

          var schemaName = query ? ("Frequently Asked Questions about " + query) : "Frequently Asked Questions: Amazon Buying & Product Decisions";

          var schema = {
            "@context": "https://schema.org",
            "@type": "FAQPage",
            "@id": "https://productreviews.review/#dynamic-faq",
            "name": schemaName,
            "mainEntity": faqs.map(function(item) {
              var qText = item.q;
              if (query && qText.toLowerCase().indexOf(query.toLowerCase()) === -1) {
                qText = qText.replace(/\?$/, '') + " (" + query + ")?";
              }
              return {
                "@type": "Question",
                "name": qText,
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": item.a
                }
              };
            })
          };

          var scriptEl = document.getElementById('dynamic-faq-schema');
          if (!scriptEl) {
            scriptEl = document.createElement('script');
            scriptEl.id = 'dynamic-faq-schema';
            scriptEl.type = 'application/ld+json';
            document.head.appendChild(scriptEl);
          }
          scriptEl.textContent = JSON.stringify(schema, null, 2);
        }

        if (typeof window !== 'undefined') {
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', injectFaqSchema);
          } else {
            injectFaqSchema();
          }

          window.addEventListener('popstate', injectFaqSchema);
          window.addEventListener('hashchange', injectFaqSchema);

          ['pushState', 'replaceState'].forEach(function(m) {
            var orig = window.history[m];
            if (typeof orig === 'function') {
              window.history[m] = function() {
                var res = orig.apply(this, arguments);
                try { injectFaqSchema(); } catch(e) {}
                return res;
              };
            }
          });
        }
      })();
