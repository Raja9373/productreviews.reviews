<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Crisp white square background for 1:1 pixel perfection -->
  <rect width="64" height="64" fill="#FFFFFF" />

  <!-- Outer Iris (Trustpilot Emerald Green #00B67A with subtle darker limbal edge) -->
  <circle cx="32" cy="32" r="26" fill="#00B67A" stroke="#008254" stroke-width="1.5" />

  <!-- Subtle Iris Radiating Texture & Golden Flecks -->
  <!-- Inner ring depth -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#00D08C" stroke-width="2" opacity="0.6" />
  
  <!-- Subtle Golden Flecks around pupil (#FFC83B) -->
  <g fill="#FFD036" opacity="0.9">
    <circle cx="32" cy="18" r="1.5" />
    <circle cx="42" cy="22" r="1.3" />
    <circle cx="46" cy="32" r="1.5" />
    <circle cx="42" cy="42" r="1.3" />
    <circle cx="32" cy="46" r="1.5" />
    <circle cx="22" cy="42" r="1.3" />
    <circle cx="18" cy="32" r="1.5" />
    <circle cx="22" cy="22" r="1.3" />
    
    <!-- Micro inner accent rays -->
    <path d="M32 20 L32 23 M44 32 L41 32 M32 44 L32 41 M20 32 L23 32" stroke="#FFE066" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Collarette accent ring -->
  <circle cx="32" cy="32" r="11" fill="none" stroke="#FFD036" stroke-width="1" opacity="0.75" />

  <!-- Tiny Pure Black Pupil in Center -->
  <circle cx="32" cy="32" r="6.5" fill="#000000" />
</svg>
